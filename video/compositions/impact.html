  <script>
    (function () {
      // beat-locked moments on the 0.875 s grid (scene starts on the drop)
      const M = { 16: 0.875, 18: 2.625, 20: 3.5, 22: 4.375, 26: 6.125, 28: 7.0 };
      const b = (n) => M[n];
      const tl = gsap.timeline({ paused: true });

      // ---------- DROP: explosion
      tl.fromTo("#im-flash", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);
      let seed = 4242;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      const host = document.getElementById("im-shards");
      const glyphs = ["0", "1", "%", "Σ", "7", "3", "9", "$", "4", "8"];
      for (let i = 0; i < 70; i++) {
        const el = document.createElement("div");
        el.className = "shard";
        el.textContent = glyphs[Math.floor(rnd() * glyphs.length)];
        host.appendChild(el);
        const a = rnd() * Math.PI * 2;
        const r = 500 + rnd() * 900;
        tl.fromTo(el,
          { x: 0, y: 0, scale: 0.4, opacity: 1, rotation: 0 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.7, scale: 1 + rnd() * 2.5, rotation: (rnd() - 0.5) * 240, opacity: 0, duration: 0.7 + rnd() * 0.4, ease: "expo.out" }, 0);
      }

      // dashboard assembles out of the blast, from depth
      const parts = ["#im-head", "#im-k1", "#im-k2", "#im-k3", "#im-k4", "#im-bars", "#im-line", "#im-donut"];
      parts.forEach((s, i) => {
        tl.fromTo(s,
          { z: -1400, opacity: 0, rotationX: 20, filter: "blur(12px)" },
          { z: 0, opacity: 1, rotationX: 0, filter: "blur(0px)", duration: 0.75, ease: "expo.out" }, 0.08 + i * 0.06);
      });

      // ---------- camera: continuous orbit + beat-locked framings
      tl.fromTo("#im-cam", { rotationY: -22, rotationX: 10, x: 0, y: 0, z: -500 }, { rotationY: -12, rotationX: 6, z: -140, duration: 1.4, ease: "expo.out" }, 0);
      tl.to("#im-cam", { rotationY: -4, rotationX: 4, z: -80, duration: b(22) - 1.4, ease: "power1.inOut" }, 1.4);
      // n22: close-up on the line chart + KPI, depth of field
      tl.to("#im-cam", { x: -420, y: 120, z: 520, rotationY: -14, rotationX: 2, duration: 0.6, ease: "power2.inOut" }, b(22) - 0.15);
      tl.to("#im-cam", { rotationY: -8, duration: b(26) - b(22) - 0.6, ease: "none" }, b(22) + 0.45);
      tl.to(["#im-bars", "#im-k1", "#im-k3", "#im-k4", "#im-head"], { filter: "blur(7px)", opacity: 0.55, duration: 0.5, ease: "power2.inOut" }, b(22) - 0.1);
      // n26: orbit across to the bar chart from the other side
      tl.to("#im-cam", { x: 330, y: -10, z: 420, rotationY: 16, rotationX: 4, duration: 0.6, ease: "power2.inOut" }, b(26) - 0.15);
      tl.to(["#im-bars", "#im-k1", "#im-head"], { filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power2.inOut" }, b(26) - 0.1);
      tl.to(["#im-line", "#im-donut", "#im-k2", "#im-k4"], { filter: "blur(7px)", opacity: 0.55, duration: 0.45, ease: "power2.inOut" }, b(26) - 0.1);
      // n28: pull back wide, everything sharp
      tl.to("#im-cam", { x: 0, y: 0, z: -260, rotationY: 10, rotationX: 6, duration: 0.6, ease: "power2.inOut" }, b(28) - 0.15);
      tl.to(["#im-line", "#im-donut", "#im-k2", "#im-k3", "#im-k4"], { filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power2.inOut" }, b(28) - 0.1);
      // whip pan out (left)
      tl.to("#im-cam", { x: -2600, rotationY: 30, duration: 0.32, ease: "power2.in" }, 8.75 - 0.33);
      tl.fromTo("#im-persp", { filter: "blur(0px)" }, { filter: "blur(18px)", duration: 0.32, ease: "power2.in" }, 8.75 - 0.33);

      // ---------- data performs
      // KPI roll-ups
      const kv = { a: 0, b: 0, c: 0, d: 0 };
      tl.fromTo(kv, { a: 0, b: 0, c: 0, d: 0 }, {
        a: 2.4, b: 99.2, c: 72, d: 34, duration: 1.6, ease: "power3.out",
        onUpdate: () => {
          document.getElementById("im-v1").textContent = kv.a.toFixed(1) + "M";
          document.getElementById("im-v2").textContent = kv.b.toFixed(1) + "%";
          document.getElementById("im-v3").textContent = "−" + Math.round(kv.c) + "%";
          document.getElementById("im-v4").textContent = "+" + Math.round(kv.d) + "%";
        },
      }, 0.55);
      // n16: bars grow
      tl.fromTo("#im-plot .bar", { scaleY: 0 }, { scaleY: 1, duration: 0.6, stagger: 0.05, ease: "expo.out" }, b(16));
      tl.fromTo("#im-plot .bv", { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: 0.05, ease: "power1.out" }, b(16) + 0.3);
      // n18: glowing line draws
      const P = document.getElementById("im-path");
      const L = P.getTotalLength();
      tl.fromTo(P, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, b(18));
      tl.fromTo("#im-area", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, b(18) + 0.5);
      tl.fromTo("#im-dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, b(18) + 0.88);
      tl.fromTo("#im-line-big", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, b(18) + 0.9);
      // n20: donut fills
      const C = 2 * Math.PI * 78;
      const dv = { p: 0 };
      tl.fromTo("#im-ring", { strokeDasharray: `0 ${C}` }, { strokeDasharray: `${C * 0.98} ${C}`, duration: 0.9, ease: "power3.out" }, b(20));
      tl.fromTo(dv, { p: 0 }, {
        p: 98, duration: 0.9, ease: "power3.out",
        onUpdate: () => (document.getElementById("im-pct").textContent = Math.round(dv.p) + "%"),
      }, b(20));
      // n26: top bar highlight + tooltip
      tl.fromTo("#im-tip", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, b(26) + 0.2);

      window.__timelines["impact"] = tl;
    })();
  </script>
