<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Nombre","default":"ROBERT DE LA CRUZ"},
    {"id":"role1","type":"string","label":"Rol 1","default":"INGENIERO DE SISTEMAS"},
    {"id":"role2","type":"string","label":"Rol 2","default":"ANALISTA DE DATOS"},
    {"id":"tagline","type":"string","label":"Mensaje final","default":"Transformando datos en decisiones."},
    {"id":"signature","type":"string","label":"Firma","default":"Robert De la Cruz — Analista de Datos"},
    {"id":"linkedin","type":"string","label":"LinkedIn","default":"LinkedIn"},
    {"id":"email","type":"string","label":"Email","default":"Email"},
    {"id":"accent","type":"color","label":"Acento cian","default":"#19E6FF"},
    {"id":"blue","type":"color","label":"Acento azul","default":"#2F7BFF"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #04070d;
        --ink: #e8f3ff;
        --accent: #19e6ff;
        --blue: #2f7bff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--ground);
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="engine"
        data-composition-id="engine"
        data-composition-src="compositions/engine.html"
        data-start="7"
        data-duration="7.83"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="impact"
        data-composition-id="impact"
        data-composition-src="compositions/impact.html"
        data-start="14.83"
        data-duration="8.95"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="23.78"
        data-duration="6.22"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Música: "ice (slowed)". Arranca en 1.97 s de la pista para que la batería
           caiga en v=7.00 y el drop en v=14.83. -->
      <audio
        id="music"
        class="clip"
        src="assets/ice.m4a"
        data-start="0"
        data-duration="30"
        data-media-start="1.97"
        data-volume="1"
        data-fade-out="2"
        data-track-index="5"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
